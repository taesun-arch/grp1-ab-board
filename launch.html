<style>
/* 마케팅 보고서(2026-11-19) — 새 게임 UA 시작 후 D1·D3·D7 시점의 고정 스냅숏 + Claude 무인 해석.
   숫자는 launch.publish 산출을 그대로 그린다(다시 계산하지 않음, 비율만 [분자, 분모] 로 나눈다). 설계 docs/superpowers/specs/2026-11-19-launch-report-design.md */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gc,var(--accent));outline-offset:2px}
.wrap{padding:6px var(--gutter) 40px;max-width:calc(var(--maxw) + 2 * var(--gutter));margin:0 auto}
.muted{color:var(--ink-3)}
.toolbar{position:sticky;top:57px;z-index:15;margin:0 0 16px;padding:10px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
@media (max-width:720px){ .toolbar{position:static} }
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.chip .lbl{font-size:12px;color:var(--ink-3)}
.osb,.nb{border:1px solid transparent;background:transparent;color:var(--ink-2);font-size:12.5px;padding:4px 11px;border-radius:999px}
.osb:hover,.nb:hover{color:var(--ink);border-color:var(--line)} .osb.on,.nb.on{background:var(--ink);color:var(--bg);font-weight:600}
.nb:disabled{opacity:.45;cursor:not-allowed;border-color:transparent}
.pstat{font-size:12px;color:var(--ink-3)}
.notice{margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--ink-2);background:var(--card)}
.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.rhead{margin:0 0 16px;font-size:15px;font-weight:600}
.rhead .sub{display:block;margin-top:4px;font-size:12.5px;font-weight:400;color:var(--ink-3)}
main section{margin:0 0 22px;padding:18px 20px 22px;border:1px solid var(--line-soft);border-radius:18px;background:color-mix(in srgb,var(--card) 40%,var(--bg))}
main section > h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;font-size:19px;font-weight:600;margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid var(--line)}
main section > h2 .muted{font-weight:400;font-size:12.5px}
main section > h2::before{content:attr(data-no);align-self:center;font:600 11.5px/1 var(--mono);padding:5px 8px;border-radius:999px;color:var(--gc,var(--accent));background:color-mix(in srgb,var(--gc,var(--accent)) 16%,transparent)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0 0 12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:11px 14px 12px;overflow:hidden;min-width:0}
.tile .k{font-size:12px;color:var(--ink-3);font-weight:500}
.tile .v{margin-top:4px;font:600 22px/1.1 var(--font);letter-spacing:-.01em}
.tile .s{margin-top:4px;font-size:11.5px;color:var(--ink-3)}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;min-width:0;margin:0 0 12px}
.card h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink-2)} .card h3 .muted{font-weight:400}
.card .foot{margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.tscroll{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
th{color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:120px}
tr.me td{font-weight:600;background:color-mix(in srgb,var(--gc,var(--accent)) 10%,var(--card))}
tr.dim td{color:var(--ink-3);opacity:.7}
td.na{color:var(--ink-3)}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--ink-2);margin-left:4px;vertical-align:1px;white-space:nowrap}
svg{display:block;width:100%;height:auto;max-height:260px} svg text{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
svg .axis{stroke:var(--line);stroke-width:1} svg .gridl{stroke:var(--line-soft);stroke-width:1}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:10px;font-size:13px}
.nstat{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 12px;font-size:12.5px;color:var(--ink-2)}
.nstat .ok{color:var(--good);font-weight:600} .nstat .bad{color:var(--crit);font-weight:600} .nstat .wait{color:var(--warn);font-weight:600}
.note h3{font-size:15px;margin:18px 0 8px;color:var(--ink)} .note h3:first-child{margin-top:0} .note h4{font-size:13.5px;margin:14px 0 6px}
.note p{margin:6px 0;line-height:1.6} .note ul{margin:6px 0;padding-left:20px} .note li{margin:3px 0;line-height:1.55}
.note table{margin:8px 0} .note td,.note th{white-space:normal;text-align:left}
details.defs,details.more{margin-top:8px;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:12px 16px;color:var(--ink-2);font-size:12.5px}
details.defs summary,details.more summary{cursor:pointer;font-weight:600;color:var(--ink)} details.defs li{margin:4px 0}
.lock{max-width:420px;margin:48px auto;padding:26px;background:var(--card);border:1px solid var(--line-soft);border-radius:16px;text-align:center}
.lock b{font:700 20px var(--game)} .lock form{display:flex;gap:8px;justify-content:center;margin-top:14px}
.lock input{background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--ink);min-width:0}
.lock button{border:0;border-radius:999px;padding:8px 18px;background:var(--ink);color:var(--bg);font-weight:600}
.err{color:var(--crit)}
@media (max-width:720px){
  .tile .v{font-size:19px} main section{padding:14px 12px 16px} .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chip{flex-wrap:wrap;border-radius:14px} th:first-child,td:first-child{min-width:96px}
}
</style>
</head>

<header class="gx-bar">
  <a class="gx-brand" href="index.html" data-keep-hash title="메인으로"><b>GRP1</b><span>대시보드</span></a>

</header>
<section class="gx-hero" id="hero">
  <div class="gx-wash"></div><img class="gx-art" alt="" hidden><div class="gx-shade"></div>
  <div class="gx-copy">
    <div class="gx-when"><span class="gx-pill">마케팅 보고서</span><span>출시 초기 D1 · D3 · D7 — 그 시점 숫자를 고정한 보고서 + 해석</span></div>
    <h1 class="gx-name">마케팅 보고서</h1>
    <div class="gx-doc" id="hdoc"></div>
  </div>

</section>
<main class="wrap">
  <div id="lock" hidden></div>
  <div id="board" hidden>
    <div class="toolbar"><div class="filters" id="filters"></div></div>
    <div id="notice"></div>
    <div id="head" class="rhead"></div>
    <div id="nobody" hidden></div>
    <div id="body">
      <section id="s1"><h2 data-no="Ⅰ">요약 · 다른 게임 비교 <span class="muted">같은 OS · 같은 시점 · 같은 표본 규칙</span></h2><div id="b1"></div></section>
      <section id="s2"><h2 data-no="Ⅱ">리텐션 · 진행 <span class="muted">레벨 지표 = 설치 후 n일 관측 창</span></h2><div id="b2"></div></section>
      <section id="s3"><h2 data-no="Ⅲ">매출</h2><div id="b3"></div></section>
      <section id="s4"><h2 data-no="Ⅳ">소재 <span class="muted">AppsFlyer 광고(Ad) · 매출은 유료만</span></h2><div id="b4"></div></section>
      <section id="s5"><h2 data-no="Ⅴ">국가 · 권역 <span class="muted">광고비 = Master 국가별 · 매출은 유료만</span></h2><div id="b5"></div></section>
      <section id="s6"><h2 data-no="Ⅵ">해석 · 의견 <span class="muted">Claude 무인 작성 — 읽고 수정 요청하면 고친다</span></h2><div id="b6"></div></section>
    </div>
    <details class="defs"><summary>정의 · 한계</summary><ul id="defs"></ul></details>
  </div>
</main>

<script>
GX.prehero(document.getElementById('hero'));
// 평문은 로컬(file:·localhost)이나 ?data= 명시일 때만 — 공개 사이트엔 암호문만 있다(다른 보드와 같은 규칙). ?data=test → launch-data.test.js
(function(){ var k = new URLSearchParams(location.search).get('data'); var f = k && /^[a-z0-9_-]{1,20}$/.test(k) && k!=='real' ? 'launch-data.'+k+'.js' : 'launch-data.js';
  if (GX.wantsPlain()) document.write('<script src="'+f+'"><\/script>'); })();
</script>
<script src="launch-data.enc.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id), esc = GX.esc;
GX.wireTheme($("theme")); GX.withHash();
const CELL_MIN = 20;              // launch/config.py CELL_MIN — 칸 표본이 이보다 작으면 흐리게(해석 근거 금지)
const NS = [1, 3, 7];
const OSN = {ios: "iOS", aos: "Android"};
const Q = new URLSearchParams(location.search);
const fmt = {
  n: v => v == null ? "–" : Math.round(v).toLocaleString("en-US"),
  usd: (v, d = 2) => v == null || !isFinite(v) ? "–" : "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d}),
  p: (v, d = 1) => v == null || !isFinite(v) ? "–" : (v * 100).toFixed(d) + "%",
};
const rt = (a, b) => b ? a / b : null;                            // [분자, 분모] → 비율
const pr = x => x ? fmt.p(rt(x[0], x[1])) : "–";
const prn = x => x ? `${fmt.p(rt(x[0], x[1]))} <span class="muted">(${fmt.n(x[0])}/${fmt.n(x[1])})</span>` : "–";
let D = null, G = null, KEY = null, notTarget = null;
const st = {plat: null, n: 1};

const tile = (label, value, sub) => `<div class="tile"><div class="k">${esc(label)}</div><div class="v">${value}</div><div class="s">${sub || ""}</div></div>`;
const card = (title, body, foot = "") => `<div class="card"><h3>${title}</h3>${body}${foot ? `<div class="foot">${foot}</div>` : ""}</div>`;
const empty = msg => `<div class="empty">${esc(msg)}</div>`;
const table = (id, head, rows) => `<div class="tscroll"><table${id ? ` id="${id}"` : ""}><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
const band = b => b[1] == null ? `L${b[0]}+` : (b[0] === b[1] ? `L${b[0]}` : `L${b[0]}–${b[1]}`);

function pendText(p) {
  if (!p) return "아직 대기 상태 없음";
  if (p.state === "collecting") return `표본 모으는 중 ${fmt.n(p.have)}/${fmt.n(p.need)}`;
  if (p.state === "wait_data") return `데이터 도착 대기 (마감 ${p.T})`;
  if (p.state === "wait_revenue") return `광고 매출 도착 대기 (마감 ${p.T})`;
  if (p.state === "expired") return `표본 ${fmt.n(p.need)} 미달로 종료`;
  return "생성 대기";
}
const rep = (plat, n) => ((G.reports || {})[plat] || {})[String(n)] || null;
const pend = (plat, n) => ((G.pending || {})[plat] || {})[String(n)] || null;

function drawFilters() {
  const plats = G.plats.length ? G.plats : Object.keys(G.reports);
  let h = `<span class="chip"><span class="lbl">시점</span>${NS.map(n => { const r = rep(st.plat, n), t = r ? `D${n} 보고서` : pendText(pend(st.plat, n));
    return `<button class="nb${st.n === n && r ? " on" : ""}" type="button" data-n="${n}" title="${esc(t)}"${r ? "" : " disabled"}>D${n}</button>`; }).join("")}</span>`;
  if (plats.length > 1) h += `<span class="chip"><span class="lbl">OS</span>${plats.map(p => `<button class="osb${st.plat === p ? " on" : ""}" type="button" data-p="${p}">${OSN[p] || p}</button>`).join("")}</span>`;
  const waits = NS.filter(n => !rep(st.plat, n)).map(n => `D${n} ${pendText(pend(st.plat, n))}`);
  if (waits.length) h += `<span class="pstat">${esc(waits.join(" · "))}</span>`;
  $("filters").innerHTML = h;
  $("filters").querySelectorAll(".nb").forEach(b => b.addEventListener("click", () => { if (!b.disabled) { st.n = +b.dataset.n; render(); } }));
  $("filters").querySelectorAll(".osb").forEach(b => b.addEventListener("click", () => { st.plat = b.dataset.p; pickN(); render(); }));
}
function pickN() { if (!rep(st.plat, st.n)) st.n = NS.find(n => rep(st.plat, n)) || st.n; }

function render() {
  drawFilters();
  $("notice").innerHTML = notTarget ? `<div class="notice">${esc(notTarget)}은(는) 보고서 대상이 아닙니다 — 대상: ${esc(D.report_keys.map(k => D.games[k].name).join(" · "))} (출시 후 D1·D3·D7 보고서는 새로 추가되는 게임부터)</div>` : "";
  const R = rep(st.plat, st.n);
  if (!R) {
    $("head").innerHTML = `${esc(G.name)} · ${OSN[st.plat] || st.plat} <span class="sub">${esc(NS.map(n => `D${n} ${pendText(pend(st.plat, n))}`).join(" · "))}</span>`;
    $("nobody").innerHTML = empty(`아직 보고서가 없습니다 — ${pendText(pend(st.plat, 1))}. 보고서는 Dn 이 끝난 유료 설치가 200명 이상 모인 날을 마감으로 만듭니다.`);
    $("nobody").hidden = false; $("body").hidden = true;
    return;
  }
  $("nobody").hidden = true; $("body").hidden = false;
  const S = R.snap, n = S.n;
  const warn = [];
  if (S.norev) warn.push("광고 매출 원시가 마감일까지 도착하지 않은 채 만든 보고서 — ROAS 가 낮게 잡혀 있다");
  if (!S.organic_from) warn.push("이 OS 는 오가닉 원시가 없어 '오가닉 포함' ROAS 가 실제로는 유료 설치자 매출만이다");
  else if (S.organic_from > S.S) warn.push(`설치일 ${S.organic_from} 전은 오가닉 원시가 온전하지 않아 '오가닉 포함' ROAS 가 그 날들만 유료 설치자 매출이다`);
  // 매출 출처(설계 4.1) — Cohort API 면 ROAS·설치일별·소재·국가 매출이 그것, 레벨 구간별 매출·상위 10명은 원시 유저 매출(도착한 날까지)
  const fromCohort = S.rev_source === "cohort_api";
  if (fromCohort && S.user_rev_until && S.user_rev_until < S.T) warn.push(`레벨 구간별 매출·상위 10명 비중은 원시 매출 ${S.user_rev_until} 까지만 — 그 뒤 날 매출이 빠져 있다(ROAS 는 Cohort API 라 온전)`);
  (S.rebuilt || []).forEach(r => warn.push(`재산출 ${r.at} — ${r.reason}`));
  const src = fromCohort ? `매출 = AF Cohort API(완료된 날만, 받은 시각 ${esc(S.cohort_fetched_at || "?")}) · 설치·잔존·레벨 = 원시` : "매출 = 원시";
  $("head").innerHTML = `${esc(G.name)} · D${n} · 마케팅 ${S.mday}일차 작성 · 마감 ${esc(S.T)} · 관측 창 유료 ${fmt.n(S.base.n)}명`
    + `<span class="sub">${OSN[S.plat] || S.plat} · 첫 유료 설치 ${esc(S.S)} · 관측 창 = 설치일 ${esc(S.base.days[0])}~${esc(S.base.days[S.base.days.length - 1])} 유저를 각자 설치 후 ${n}일까지 · 생성 ${esc(S.created_at)} · ${src}</span>`
    + warn.map(w => `<div class="notice warn" style="margin-top:8px">${esc(w)}</div>`).join("");
  renderS1(R); renderS2(S); renderS3(S); renderS4(S); renderS5(S); renderS6(R);
}

function sumCells(s, n) {
  const m = s.summary, nk = String(n);
  return [fmt.n(m.n), fmt.usd(m.cost), fmt.usd(m.cpi), pr(m.ret["1"]), ...(n > 1 ? [pr(m.ret[nk])] : []),
          pr(m.roas_all["1"]), ...(n > 1 ? [pr(m.roas_all[nk])] : []), pr(m.reach["5"]), pr(m.reach["10"]), fmt.p(m.top10_share)];
}
// Dk 합산 범위 — D3·D7 보고서의 D1 은 D1 이 끝난 설치일 전부라 관측 창보다 넓은 다른 코호트다(최종 리뷰 11-19). 타일마다 범위·인원을 붙인다
const coh = (m, k) => { const c = (m.cohorts || {})[String(k)]; return c ? `설치일 ${esc(c.from)}~${esc(c.to)} · ${fmt.n(c.n)}명` : ""; };
function renderS1(R) {
  const S = R.snap, m = S.summary, n = S.n, nk = String(n);
  let h = `<div class="tiles">` + tile("유료 설치", fmt.n(m.n), "관측 창") + tile("광고비", fmt.usd(m.cost)) + tile("CPI", fmt.usd(m.cpi))
    + tile("D1 잔존", pr(m.ret["1"]), coh(m, 1))
    + (n > 1 ? tile(`D${n} 잔존`, pr(m.ret[nk]), coh(m, n)) : "")
    + tile("D1 ROAS", pr(m.roas_all["1"]), `${coh(m, 1)} · 유료만 ${pr(m.roas_paid["1"])}`)
    + (n > 1 ? tile(`D${n} ROAS`, pr(m.roas_all[nk]), `${coh(m, n)} · 유료만 ${pr(m.roas_paid[nk])}`) : "")
    + tile("L5+ 도달", pr(m.reach["5"]), `설치 후 ${n}일`) + tile("L10+ 도달", pr(m.reach["10"]), `설치 후 ${n}일`)
    + tile("상위 10명 매출 비중", fmt.p(m.top10_share), "높으면 ROAS 차이를 단정하지 않는다") + `</div>`;

function reachSvg(reach, base) {
  const W = 560, H = 200, L = 34, B = 22, T = 8, Rr = 8, xs = reach.map(r => r[0]), maxN = Math.max(...xs, 1);
  const X = N => L + (N - 1) / Math.max(maxN - 1, 1) * (W - L - Rr), Y = v => T + (1 - v) * (H - T - B);
  let g = "";
  [0, .25, .5, .75, 1].forEach(v => { g += `<line class="gridl" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end">${v * 100}%</text>`; });
  xs.filter(N => N === 1 || N % 10 === 0).forEach(N => { g += `<text x="${X(N)}" y="${H - 6}" text-anchor="middle">L${N}</text>`; });
  const pts = reach.map(r => `${X(r[0]).toFixed(1)},${Y(base ? r[1] / base : 0).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="도달 곡선">${g}<line class="axis" x1="${L}" x2="${W - Rr}" y1="${Y(0)}" y2="${Y(0)}"/><polyline points="${pts}" fill="none" stroke="var(--gc,var(--accent))" stroke-width="2"/></svg>`;
}

function boot(data) {
  D = data; const keys = D.report_keys || [];
  if (!keys.length) { $("lock").hidden = false; $("lock").innerHTML = empty("보고서 대상 게임이 아직 없음 — python -m launch.publish"); return; }
  $("lock").hidden = true; $("board").hidden = false;
  $("gen").textContent = `산출 ${D.generated_at || ""}`;
  $("games").innerHTML = keys.map(k => GX.posterBtn(k, D.games[k].name, false)).join("");
  $("games").querySelectorAll(".gx-game").forEach(b => b.addEventListener("click", () => { notTarget = null; useGame(b.dataset.g, true); }));
  const want = Q.get("game") || GX.lastGame();
  if (want && keys.includes(want)) return useGame(want, !!Q.get("game"));
  // 이어진 게임이 보고서 대상이 아니면 가장 최근 출시 게임을 연다(마지막 게임 기억은 그대로 둔다 — 다른 보드로 돌아가면 원래 게임)
  if (want) notTarget = (GX.GAMES[want] || {}).name || want;
  const S0 = k => { const g = D.games[k], ss = []; Object.values(g.reports).forEach(o => Object.values(o).forEach(r => ss.push(r.snap.S)));
    Object.values(g.pending || {}).forEach(o => Object.values(o).forEach(p => p.S && ss.push(p.S))); return ss.sort()[0] || ""; };
  useGame(keys.slice().sort((a, b) => S0(a) < S0(b) ? 1 : -1)[0], false);
}

/* ── 데이터: 평문(launch-data.js, 로컬) → 암호문(launch-data.enc.js, 공개 URL) — 다른 보드와 같은 형식·비밀번호·저장 키 ── */
const PWKEY = "genboard:pass", b64 = GX.b64;
async function decryptData(enc, pass) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(enc.iv)}, key, b64(enc.ct))));
}
function showUnlock(enc, err) {
  $("lock").hidden = false;
  $("lock").innerHTML = `<div class="lock"><b>마케팅 보고서</b><div class="${err ? "err" : ""}" style="margin:8px 0 0;font-size:13px;color:${err ? "" : "var(--ink-3)"}">${err || "집계 데이터는 암호화되어 있습니다. 비밀번호를 입력하면 이 브라우저 안에서만 풉니다."}</div>
    <form id="pwform"><input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password"><button type="submit">열기</button></form></div>`;
  $("pwform").onsubmit = async ev => { ev.preventDefault();
    try { const pass = $("pw").value; const data = await decryptData(enc, pass); try { localStorage.setItem(PWKEY, pass); } catch (e) {} boot(data); }
    catch (e) { showUnlock(enc, "비밀번호가 맞지 않습니다."); } };
  $("pw").focus();
}

  const enc = window.LAUNCH_DATA_ENC;
  if (!enc) { $("lock").hidden = false; $("lock").innerHTML = empty("launch-data.js 가 없거나 비어 있음 — python -m launch.publish 실행"); return; }
  if (!(window.crypto && crypto.subtle)) { $("lock").hidden = false; $("lock").innerHTML = empty("이 환경에서는 암호를 풀 수 없습니다. https 주소 또는 로컬 파일로 열어야 합니다."); return; }
  const m = /(?:^#|[#&])k=([^&]+)/.exec(location.hash);
  if (m) { try { const pass = decodeURIComponent(m[1]); const data = await decryptData(enc, pass); try { localStorage.setItem(PWKEY, pass); } catch (e) {} return boot(data); } catch (e) {} }
  let saved = null; try { saved = localStorage.getItem(PWKEY); } catch (e) {}
  if (saved) { try { return boot(await decryptData(enc, saved)); } catch (e) {} }
  showUnlock(enc, null);
})();
})();
</script>
