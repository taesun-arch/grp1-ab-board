<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRP1 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<style>
/* 메인 — 벤토(기본) · 브리핑 두 보기(팀장님 2026-10-27: "시안 B 기본에 시안 A 로 전환"). 숫자는 board_summary.py 요약(암호문).
   A/B 코호트 보드는 2026-10-27 메인에서 뺐다(모든 실험 종료). ab.html 파일은 공개 사이트에 마지막 판 그대로 남아 있다. */
*{box-sizing:border-box}
[hidden]{display:none!important}     /* .bento{display:grid} 가 hidden 을 이기지 않게 — 보기 전환이 이 속성으로 숨긴다 */
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.page{max-width:calc(var(--maxw) + 2 * var(--gutter));margin:0 auto;padding:28px var(--gutter) 30px}
.top{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 14px;margin-bottom:16px}
.top h1{margin:0;font:700 30px/1 var(--game)} .top .when{color:var(--ink-3);font:12.5px var(--mono)}
.view{margin-left:auto;display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line-soft)}
.view button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.view button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.up{color:var(--good)} .down{color:var(--crit)}
.k{font-size:12px;color:var(--ink-3);font-weight:500} .s{font-size:11.5px;color:var(--ink-3)}
.mid{font:600 24px/1.15 var(--font);font-variant-numeric:tabular-nums}
.name{font:700 22px/1.05 var(--game)}
.spark svg{display:block;width:100%}

/* ── 벤토 ── */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:150px;gap:14px}
.t{position:relative;overflow:hidden;isolation:isolate;border-radius:22px;border:1px solid var(--line-soft);background:var(--card);padding:18px 20px;display:flex;flex-direction:column;transition:transform .2s var(--ease),border-color .2s}
a.t:hover{transform:translateY(-2px);border-color:var(--line)}
.big{font:600 46px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero{grid-column:span 7;grid-row:span 2;padding:26px 28px}
.hero .art{position:absolute;right:-30px;top:-20px;height:130%;aspect-ratio:1;object-fit:cover;z-index:-2;opacity:.92;
  -webkit-mask-image:radial-gradient(circle at 65% 45%,#000 30%,transparent 70%);mask-image:radial-gradient(circle at 65% 45%,#000 30%,transparent 70%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--card) 30%,transparent 75%)}
.pill{align-self:flex-start;background:var(--c);color:#12131a;font-weight:600;font-size:12px;padding:4px 10px;border-radius:999px}
.hero .name{font-size:42px;margin:12px 0 auto}
.kv{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end} .kv .big{color:var(--c)}
.side{grid-column:span 5;grid-row:span 1;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card) 60%)}
.side .head{display:flex;align-items:center;gap:10px} .side .head img{width:34px;height:34px;border-radius:22%}
.row3{display:flex;gap:24px;flex-wrap:wrap;margin-top:auto}
.sum{grid-column:span 5;grid-row:span 1;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card))}
.over{grid-column:span var(--span,6)}   /* 히어로 옆 두 자리를 넘친 UA·합계 타일 — 아래 한 줄을 균등 분할(UA 4게임, 2026-10-27) */
.g{grid-column:span 3;grid-row:span 2}
.g .head{display:flex;align-items:center;gap:12px} .g .head img{width:48px;height:48px;border-radius:22%}
.g .row3{gap:18px;margin-top:12px} .g .spark{margin-top:auto} .g .spark svg{height:56px}
.board{grid-column:span 6;grid-row:span 1;justify-content:center}
.board .name{font-size:26px} .board .icons{display:flex;gap:6px;margin-top:8px} .board .icons img{width:28px;height:28px;border-radius:22%}
.board::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--bc)}
.board .go{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--ink-3)}
.lockt{grid-column:span 12;grid-row:span 2;align-items:center;justify-content:center;text-align:center}
.lockt b{font:700 22px var(--game)} .lockt form{display:flex;gap:8px;justify-content:center;margin-top:14px}
.lockt input{background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--ink);font:inherit}
.lockt button{border:0;border-radius:999px;padding:8px 18px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}

/* ── 브리핑 ── */
.totals{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.tot{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:12px 18px;min-width:150px}
.blk{margin-top:26px}
.blk h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin:0 0 12px;font-size:18px;font-weight:600}
.blk h2 small{font-size:12.5px;color:var(--ink-3);font-weight:400}
.blk h2 a{margin-left:auto;font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.blk h2 a:hover{color:var(--ink);border-color:var(--ink-3)}
.row{position:relative;display:grid;grid-template-columns:minmax(220px,1.3fr) repeat(5,minmax(92px,1fr)) minmax(150px,1.2fr) 34px;align-items:center;gap:14px;
  padding:14px 18px;margin-bottom:10px;border-radius:16px;border:1px solid var(--line-soft);overflow:hidden;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 15%,var(--card)) 0%,var(--card) 34%)}
.row:hover{border-color:var(--line)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who img{width:52px;height:52px;border-radius:22%;flex:none;box-shadow:0 6px 18px -8px rgba(0,0,0,.7)}
.who b{display:block;font:700 19px/1.1 var(--game)} .who span{font-size:12px;color:var(--ink-3)}
.m .v{font:600 19px/1.25 var(--font);font-variant-numeric:tabular-nums} .m .v.hot{color:var(--c)} .m .v.good{color:var(--good)}
.meter{height:4px;border-radius:2px;background:var(--line-soft);margin-top:5px;overflow:hidden} .meter i{display:block;height:100%;background:var(--c)}
.row .spark svg{height:38px}
.go2{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink-2)}
.row:hover .go2{background:var(--c);color:#12131a}
.notice{margin-top:22px;padding:12px 16px;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;color:var(--ink-3);font-size:12.5px}
.notice b{color:var(--ink-2)}
@media (max-width:1100px){
  .bento{grid-template-columns:repeat(6,minmax(0,1fr))} .hero,.side,.sum,.over,.board,.lockt{grid-column:span 6} .g{grid-column:span 3}
  .row{grid-template-columns:1fr 1fr 1fr} .row .spark,.row .go2{display:none} .who{grid-column:1 / -1}
}
@media (max-width:640px){
  .bento{grid-auto-rows:auto} .t{min-height:150px} .hero{min-height:300px} .g .spark svg{height:44px}
  .g{grid-column:span 6} .hero .name{font-size:32px} .big{font-size:38px} .view{margin-left:0}
  .hero::after{background:linear-gradient(0deg,var(--card) 42%,color-mix(in srgb,var(--card) 55%,transparent) 100%)}   /* 좁은 화면: 숫자 뒤가 그림으로 밝아지지 않게 */
}
</style>
</head>
<body>
<header class="gx-bar">
  <a class="gx-brand" href="index.html" data-keep-hash><b>GRP1</b><span>대시보드</span></a>
  <nav class="gx-switch" aria-label="보드"><a href="general.html" data-keep-hash>일반 지표</a><a href="ua.html" data-keep-hash>UA · 마케팅</a></nav>
  <div class="gx-right"><span class="gx-gen" id="gen"></span><button class="gx-btn" id="theme" type="button">라이트</button></div>
</header>
<main class="page">
  <div class="top">
    <h1>GRP1 대시보드</h1><span class="when" id="when"></span>
    <div class="view" role="group" aria-label="보기"><button type="button" data-v="bento" aria-pressed="true">벤토</button><button type="button" data-v="brief" aria-pressed="false">브리핑</button></div>
  </div>
  <div class="bento" id="bento"></div>
  <div id="brief" hidden></div>
  <div class="notice"><b>보드끼리 숫자를 대조하지 마세요.</b> 일반 지표는 계측 빌드 유저 전체·잔존 = <span style="font-family:var(--mono)">af_login</span>, UA 는 광고로 들어온 설치만·잔존 = 그날 인앱 이벤트 1건 이상. AppsFlyer 대시보드와도 절대값을 대조하지 않습니다(집계 기준·매출 도착 시점이 다름).</div>
</main>
<div class="gx-foot">AppsFlyer raw · Master API · UTC 달력일 · 공유 링크의 비밀번호(#k=)는 각 보드로 그대로 넘어갑니다.</div>

<script src="boards.js"></script>
<script src="summary-data.js"></script>
<script src="summary-data.enc.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id), esc = GX.esc, hash = location.hash || '';
GX.wireTheme($('theme')); GX.withHash();
const usd = (v, d = 0) => v == null ? '—' : '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (v, d = 1) => v == null ? '—' : (v * 100).toFixed(d) + '%';
const num = v => v == null ? '—' : Number(v).toLocaleString('en-US');
const md = d => d ? d.slice(5) : '';
const gen = k => 'general.html?game=' + k + hash, uaUrl = k => 'ua.html?game=' + k + hash;
const B = window.BOARDS || {};
function spark(arr, color, h) {
  arr = arr && arr.length ? arr : [0];
  const w = 200, mx = Math.max(...arr, 1), mn = Math.min(...arr, 0), n = arr.length;
  const pts = arr.map((v, i) => [(i / Math.max(n - 1, 1)) * (w - 4) + 2, h - 4 - ((v - mn) / Math.max(mx - mn, 1)) * (h - 12)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(''), last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${last[0]} ${h} L2 ${h} Z" fill="${color}" opacity=".16"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
const dauDelta = g => { if (!g || g.dau_prev == null || !g.dau_prev) return '7일 전 없음'; const ch = g.dau / g.dau_prev - 1;
  return `<span class="${ch >= 0 ? 'up' : 'down'}">${ch >= 0 ? '▲' : '▼'}${Math.abs(ch * 100).toFixed(0)}%</span> 7일 전 대비`; };

// 보기 전환 — 기본 벤토, 고른 보기는 이 브라우저에 기억(세 화면 공유 테마 저장과 별개)
let view = 'bento';
try { view = localStorage.getItem('grp1:home') || 'bento'; } catch (e) {}
const q = new URLSearchParams(location.search).get('view'); if (q === 'brief' || q === 'bento') view = q;
function setView(v) {
  view = v; document.querySelectorAll('.view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  $('bento').hidden = v !== 'bento'; $('brief').hidden = v !== 'brief';
  try { localStorage.setItem('grp1:home', v); } catch (e) {}
}
document.querySelectorAll('.view button').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));

function render(S) {
  const G = S.games || {};
  const order = [...Object.keys(G)].sort((a, b) => ((G[b].ua || {}).cost || 0) - ((G[a].ua || {}).cost || 0) || ['co', 'rr', 'tj', 'cl', 'sf'].indexOf(a) - ['co', 'rr', 'tj', 'cl', 'sf'].indexOf(b));
  const uaKeys = order.filter(k => G[k].ua), genKeys = order.filter(k => G[k].general);
  const any = (G[uaKeys[0]] || G[genKeys[0]] || {}), last = (any.ua || any.general || {}).last;
  $('when').textContent = `${last || ''} (UTC) 기준 · 갱신 ${S.generated_at || ''}`;
  $('gen').textContent = [B.general ? '일반 ' + B.general : '', B.ua ? 'UA ' + B.ua : ''].filter(Boolean).join(' · ');
  const cost = uaKeys.reduce((s, k) => s + G[k].ua.cost, 0), inst = uaKeys.reduce((s, k) => s + G[k].ua.installs, 0);
  const dauSum = genKeys.reduce((s, k) => s + G[k].general.dau, 0);
  const totals = [['광고비 · 어제', usd(cost)], ['광고 설치 · 어제', num(inst)], ['평균 CPI', usd(inst ? cost / inst : null, 2)], ['DAU 합계 · 어제', num(dauSum)]];
  const icons = ks => ks.map(k => GX.GAMES[k] ? `<img src="${GX.GAMES[k].icon}" alt="" title="${esc(GX.GAMES[k].name)}">` : '').join('');
  const C = k => (GX.GAMES[k] || {}).color || 'var(--accent)';
  const I = k => (GX.GAMES[k] || {}).icon || '';

  // ── 벤토 ──
  let h = '';
  if (uaKeys.length) {
    const f = uaKeys[0], u = G[f].ua;
    h += `<a class="t hero" href="${uaUrl(f)}" style="--c:${C(f)}">${GX.GAMES[f] ? `<img class="art" src="${GX.GAMES[f].art}" alt="">` : ''}<span class="pill">UA 진행 중</span>
      <div class="name">${esc(G[f].name)}</div>
      <div class="kv"><div><div class="k">D1 ROAS · 최근 7일</div><div class="big">${pct(u.d1)}</div><div class="s">설치 ${num(u.d1_n)}명 · 본전 100%</div></div>
      <div><div class="k">D0 ROAS · 최근 3일</div><div class="mid">${pct(u.d0)}</div><div class="s">설치 ${num(u.d0_n)}명</div></div>
      <div><div class="k">광고비 · ${md(u.last)}</div><div class="mid">${usd(u.cost)}</div><div class="s">CPI ${usd(u.cpi, 2)} · 설치 ${num(u.installs)}</div></div></div></a>`;
    // 오른쪽 열(사이드 UA 타일 + 합계) 중 히어로 옆 두 자리를 넘는 것은 아래 한 줄을 나눠 쓴다
    const rest = uaKeys.length - 2, span = rest > 0 ? Math.max(3, Math.floor(12 / rest)) : 0;
    let slot = 0; const over = () => slot++ >= 2 && span ? [' over', `--span:${span};`] : ['', ''];
    for (const k of uaKeys.slice(1)) { const v = G[k].ua, [oc, os] = over();
      h += `<a class="t side${oc}" href="${uaUrl(k)}" style="${os}--c:${C(k)}"><div class="head"><img src="${I(k)}" alt=""><span class="name" style="font-size:20px">${esc(G[k].name)}</span><span class="s" style="margin-left:auto">UA</span></div>
        <div class="row3"><div><div class="k">D1 ROAS · 7일</div><div class="mid" style="color:${C(k)}">${pct(v.d1)}</div></div><div><div class="k">광고비 · ${md(v.last)}</div><div class="mid">${usd(v.cost)}</div></div><div><div class="k">CPI</div><div class="mid">${usd(v.cpi, 2)}</div></div></div></a>`; }
    const [oc, os] = over();
    h += `<div class="t sum${oc}" style="${os}"><div class="k">어제 합계 · UA ${uaKeys.length}게임 · 게임 ${genKeys.length}개</div>
      <div class="row3">${totals.map(([k, v]) => `<div><div class="k">${k.split(' · ')[0]}</div><div class="mid">${v}</div></div>`).join('')}</div></div>`;
  }
  for (const k of genKeys) { const g = G[k].general;
    h += `<a class="t g" href="${gen(k)}" style="--c:${C(k)}"><div class="head"><img src="${I(k)}" alt=""><div><div class="name" style="font-size:19px">${esc(G[k].name)}</div><div class="s">${G[k].ua ? '일반 지표 · UA' : '일반 지표'}</div></div></div>
      <div class="row3"><div><div class="k">DAU</div><div class="mid">${num(g.dau)}</div><div class="s">${dauDelta(g)}</div></div>
      <div><div class="k">D1 잔존</div><div class="mid">${pct(g.d1)}</div><div class="s">최근 7코호트</div></div></div>
      <div class="spark">${spark(g.dau_spark, C(k), 56)}<div class="s">DAU 14일</div></div></a>`; }
  h += `<a class="t board" href="general.html${hash}" style="--bc:#6f93ff"><div class="k">GAME METRICS</div><div class="name">일반 지표 보드</div><div class="icons">${icons(genKeys)}</div><span class="go">→</span></a>`;
  h += `<a class="t board" href="ua.html${hash}" style="--bc:#ff6fb5"><div class="k">MARKETING · UA</div><div class="name">UA · 마케팅 보드</div><div class="icons">${icons(uaKeys)}</div><span class="go">→</span></a>`;
  $('bento').innerHTML = h;

  // ── 브리핑 ──
  const who = (k, sub) => `<div class="who"><img src="${I(k)}" alt=""><div><b>${esc(G[k].name)}</b><span>${sub}</span></div></div>`;
  const m = (k, v, s = '', cls = '') => `<div class="m"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  let a = `<div class="totals">${totals.map(([k, v]) => `<div class="tot"><div class="k">${k}</div><div class="mid">${v}</div></div>`).join('')}</div>`;
  if (uaKeys.length) a += `<section class="blk"><h2>UA · 마케팅 <small>광고비 · 설치 · CPI = 마지막 설치일 · D0 ROAS = 최근 3일 · D1 ROAS = 최근 7일(매출 관측 끝 기준)</small><a href="ua.html${hash}">UA 보드 →</a></h2>`
    + uaKeys.map(k => { const u = G[k].ua;
      return `<a class="row" href="${uaUrl(k)}" style="--c:${C(k)}">${who(k, 'Android · AppLovin')}
        ${m('광고비', usd(u.cost), md(u.last) + ' 설치일')}${m('설치', num(u.installs))}${m('CPI', usd(u.cpi, 2))}${m('D0 ROAS', pct(u.d0), '설치 ' + num(u.d0_n) + '명', 'hot')}
        <div class="m"><div class="k">D1 ROAS</div><div class="v ${u.d1 >= 1 ? 'good' : 'hot'}">${pct(u.d1)}</div><div class="meter"><i style="width:${Math.min(u.d1 || 0, 1) * 100}%"></i></div><div class="s">본전 100% 대비 · 설치 ${num(u.d1_n)}명</div></div>
        <div class="spark">${spark(u.cost_spark, C(k), 38)}<div class="s">설치일별 광고비</div></div><span class="go2">→</span></a>`; }).join('') + `</section>`;
  if (genKeys.length) a += `<section class="blk"><h2>게임 지표 <small>DAU · 설치 = 마지막 날 · D1 잔존 = 최근 7개 성숙 코호트 · 매출 = IAP + 광고, 광고 매출이 도착한 마지막 날(보통 이틀 전)</small><a href="general.html${hash}">일반 지표 보드 →</a></h2>`
    + genKeys.map(k => { const g = G[k].general;
      return `<a class="row" href="${gen(k)}" style="--c:${C(k)}">${who(k, G[k].ua ? '일반 지표 · UA' : '일반 지표')}
        ${m('DAU', num(g.dau), dauDelta(g))}${m('설치', num(g.installs))}${m('D1 잔존', pct(g.d1), '코호트 ' + num(g.d1_n) + '명')}
        ${m('매출 · ' + md(g.rev_day), usd(g.rev), g.iaa ? 'IAP + 광고' : 'IAP (광고 없음)')}${m('', '')}
        <div class="spark">${spark(g.dau_spark, C(k), 38)}<div class="s">DAU 14일</div></div><span class="go2">→</span></a>`; }).join('') + `</section>`;
  $('brief').innerHTML = a;
  setView(view);
}

// 잠금 — 숫자가 없을 때도 보드 바로가기는 보인다
function locked(enc, err) {
  $('gen').textContent = [B.general ? '일반 ' + B.general : '', B.ua ? 'UA ' + B.ua : ''].filter(Boolean).join(' · ');
  $('bento').innerHTML = `<div class="t lockt"><b>GRP1 대시보드</b><div class="s" style="margin-top:6px;font-size:13px;${err ? 'color:var(--crit)' : ''}">${err || '요약 숫자는 암호화되어 있습니다. 비밀번호를 입력하면 이 브라우저 안에서만 풉니다.'}</div>
    ${enc ? `<form id="pwform"><input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password"><button type="submit">열기</button></form>` : ''}</div>
    <a class="t board" href="general.html${hash}" style="--bc:#6f93ff"><div class="k">GAME METRICS</div><div class="name">일반 지표 보드</div><span class="go">→</span></a>
    <a class="t board" href="ua.html${hash}" style="--bc:#ff6fb5"><div class="k">MARKETING · UA</div><div class="name">UA · 마케팅 보드</div><span class="go">→</span></a>`;
  $('bento').hidden = false; $('brief').hidden = true;
  if (enc) { $('pwform').onsubmit = async ev => { ev.preventDefault();
    try { const p = $('pw').value; const d = await decrypt(enc, p); try { localStorage.setItem(PWKEY, p); } catch (e) {} render(d); } catch (e) { locked(enc, '비밀번호가 맞지 않습니다.'); } }; }
}
const PWKEY = 'genboard:pass';      // 일반·UA 보드와 같은 저장 키 — 한 번 입력하면 세 화면이 다 열린다
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(enc, pass) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(enc.salt), iterations: enc.iter, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(enc.iv)}, key, b64(enc.ct))));
}
(async function init() {
  if (window.SUMMARY && window.SUMMARY.games) return render(window.SUMMARY);
  const enc = window.SUMMARY_ENC;
  if (!enc || !(window.crypto && crypto.subtle)) return locked(null, enc ? 'https 주소 또는 로컬 파일로 열어야 숫자가 보입니다.' : '요약 데이터가 아직 없습니다 — 보드에서 바로 보세요.');
  const mk = /(?:^#|[#&])k=([^&]+)/.exec(location.hash);
  if (mk) { try { const p = decodeURIComponent(mk[1]); const d = await decrypt(enc, p); try { localStorage.setItem(PWKEY, p); } catch (e) {} return render(d); } catch (e) {} }
  let saved = null; try { saved = localStorage.getItem(PWKEY); } catch (e) {}
  if (saved) { try { return render(await decrypt(enc, saved)); } catch (e) {} }
  locked(enc, null);
})();
})();
</script>
